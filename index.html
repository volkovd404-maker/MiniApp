<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест кнопки</title>
  <style>
    body {
      background: #0B0D0F;
      color: #F0F2F5;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
      flex-direction: column;
      gap: 20px;
    }
    button {
      padding: 16px 32px;
      background: #00A3FF;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active {
      transform: scale(0.96);
    }
    #result {
      font-size: 24px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <h1>🧪 Тест кнопки</h1>
  <button id="test-btn">Нажми меня!</button>
  <div id="result">Ожидание клика...</div>

  <script>
    console.log('🟢 Скрипт загружен');

    document.getElementById('test-btn').addEventListener('click', function() {
      console.log('🟢 Кнопка НАЖАТА!');
      document.getElementById('result').textContent = '✅ Кнопка работает!';
      document.getElementById('result').style.color = '#00C853';
    });

    console.log('🟢 Кнопка ждёт клика');
  </script>
</body>
</html>
