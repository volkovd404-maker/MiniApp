<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Задачи команды</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    :root {
      --brand: #00ADE6;
      --brand-dark: #0099CC;
      --brand-light: #E6F7FD;
      --accent-orange: #FF6D00;
      --accent-yellow: #FFDA47;
      --accent-mint: #4ECDC4;
      --accent-pink: #FF5A87;
      --accent-purple: #7C5CFF;
      
      --bg-start: #FFF5E6;
      --bg-end: #FFEBD1;
      --card: #FFFFFF;
      --card-alt: #FFFAF0;
      --text: #1A1A2E;
      --text-soft: #4A5568;
      --hint: #8B95A5;
      --border: #F0E6D6;
      
      --shadow-sm: 0 2px 8px rgba(255, 109, 0, 0.08);
      --shadow-md: 0 8px 24px rgba(255, 109, 0, 0.12);
      --shadow-lg: 0 12px 40px rgba(0, 173, 230, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
      background-attachment: fixed;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    body {
      padding: 16px 16px 110px;
      -webkit-tap-highlight-color: transparent;
    }

    .container { max-width: 600px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
    }

    h1 { 
      font-size: 28px; 
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    h1 .emoji {
      display: inline-block;
      transform: rotate(-8deg);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      padding: 5px 12px 5px 5px;
      border-radius: 24px;
      box-shadow: var(--shadow-sm);
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 15px;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .user-name {
      font-size: 13px;
      font-weight: 600;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .month-card {
      background: linear-gradient(135deg, #00ADE6 0%, #7C5CFF 100%);
      padding: 16px 18px;
      border-radius: 20px;
      margin-bottom: 12px;
      color: white;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 8px 24px rgba(124, 92, 255, 0.25);
      position: relative;
      overflow: hidden;
    }

    .month-card::before {
      content: '';
      position: absolute;
      right: -20px;
      top: -20px;
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
    }

    .month-card::after {
      content: '';
      position: absolute;
      right: 20px;
      bottom: -30px;
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
    }

    .month-icon {
      width: 48px;
      height: 48px;
      min-width: 48px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      backdrop-filter: blur(10px);
      z-index: 1;
    }

    .month-info { flex: 1; z-index: 1; }

    .month-value {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .month-label {
      font-size: 12px;
      opacity: 0.9;
      margin-top: 4px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .month-name {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 2px;
      font-weight: 500;
    }

    .stats {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-card {
      flex: 1;
      background: white;
      padding: 12px 14px;
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
    }

    .stat-label {
      font-size: 11px;
      color: var(--hint);
      margin-top: 4px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .stat-active .stat-value { color: var(--accent-orange); }
    .stat-done .stat-value { color: var(--accent-mint); }
    .stat-mine .stat-value { color: var(--accent-purple); }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 2px;
    }
    .filters::-webkit-scrollbar { display: none; }

    .filter {
      padding: 10px 16px;
      border-radius: 24px;
      background: white;
      color: var(--text-soft);
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }

    .filter:active { transform: scale(0.96); }

    .filter.active { 
      background: var(--brand); 
      color: white;
      box-shadow: 0 4px 12px rgba(0, 173, 230, 0.35);
    }

    .tasks { display: flex; flex-direction: column; gap: 12px; }

    .empty, .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--hint);
      font-size: 15px;
      background: white;
      border-radius: 24px;
      box-shadow: var(--shadow-sm);
    }

    .empty-emoji {
      font-size: 48px;
      margin-bottom: 12px;
      display: block;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: white;
      border-radius: 20px;
      transition: all 0.2s;
      animation: slideIn 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .task::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: var(--accent-orange);
      border-radius: 3px 0 0 3px;
    }

    .task:active { transform: scale(0.99); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task.done { 
      opacity: 0.65; 
      background: var(--card-alt);
    }
    .task.done::before { background: var(--accent-mint); }
    
    .task.category-mine:not(.done)::before { 
      background: var(--accent-purple);
    }
    
    .task.hot:not(.done)::before { 
      background: linear-gradient(180deg, var(--accent-orange), var(--accent-yellow));
    }

    .check {
      width: 30px; height: 30px; min-width: 30px;
      border-radius: 50%;
      border: 2.5px solid #D8D8D8;
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      margin-left: 4px;
    }

    .check:active { transform: scale(0.9); }

    .check.done { 
      background: var(--accent-mint); 
      border-color: var(--accent-mint);
      box-shadow: 0 2px 8px rgba(78, 205, 196, 0.4);
    }

    /* Миниатюра превью в карточке */
    .task-thumb {
      width: 52px;
      height: 52px;
      min-width: 52px;
      border-radius: 12px;
      background: #F0F0F0 center/cover no-repeat;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
    }

    .task-body { flex: 1; min-width: 0; }
    
    .task-title { 
      font-size: 15px; 
      font-weight: 600; 
      word-wrap: break-word;
      line-height: 1.35;
      color: var(--text);
    }

    .task-title.strike { 
      text-decoration: line-through;
      text-decoration-color: var(--hint);
    }

    .task-badges {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      font-size: 12px;
      color: var(--hint);
      flex-wrap: wrap;
      align-items: center;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: var(--brand-light);
      color: var(--brand-dark);
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 11px;
    }

    .badge-category-mine {
      background: rgba(124, 92, 255, 0.12);
      color: var(--accent-purple);
    }

    .badge-author { font-weight: 500; }

    .fire { display: inline-block; margin-right: 4px; }

    .vote {
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center;
      min-width: 58px;
      padding: 8px 10px;
      border-radius: 16px;
      background: #F5F7FA;
      color: var(--text-soft);
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s;
    }

    .vote:active { transform: scale(0.94); }
    
    .vote.voted { 
      background: var(--brand); 
      color: white;
      box-shadow: 0 4px 12px rgba(0, 173, 230, 0.35);
    }
    
    .vote-count { 
      font-weight: 800; 
      font-size: 16px; 
      margin-top: 1px;
      line-height: 1;
    }

    .vote-emoji {
      font-size: 14px;
      line-height: 1;
    }

    .add-btn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 32px;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: white;
      border: none;
      border-radius: 32px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-lg);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .add-btn:active { transform: translateX(-50%) scale(0.96); }

    .add-btn-icon {
      width: 24px;
      height: 24px;
      background: white;
      color: var(--brand);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 46, 0.5);
      backdrop-filter: blur(4px);
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }

    .modal.active { display: flex; animation: fadeIn 0.2s ease; }

    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }

    .modal-content {
      background: linear-gradient(180deg, var(--bg-start) 0%, #ffffff 20%);
      border-radius: 28px 28px 0 0;
      padding: 28px 22px 22px;
      max-width: 500px;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      touch-action: pan-y;
    }

    .modal-content::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
    }

    .modal-content.dragging { transition: none !important; }

    @keyframes slideUp {
      from { transform: translateY(100%); } to { transform: translateY(0); }
    }

    @keyframes slideDown {
      from { transform: translateY(0); } to { transform: translateY(100%); }
    }

    .modal-content.closing {
      animation: slideDown 0.3s ease forwards;
    }

    .modal h2 { 
      margin-bottom: 20px; 
      font-size: 22px; 
      font-weight: 800;
      word-wrap: break-word;
      letter-spacing: -0.3px;
    }

    .modal label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-soft);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .modal input, .modal textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: white;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      margin-bottom: 16px;
      resize: none;
      transition: border-color 0.2s;
    }

    .modal input:focus, .modal textarea:focus {
      outline: none; 
      border-color: var(--brand);
    }

    /* Превью ссылки в форме */
    .link-preview {
      margin-top: -8px;
      margin-bottom: 16px;
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      animation: slideIn 0.3s ease;
      display: none;
    }

    .link-preview.active { display: block; }

    .link-preview.loading {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--hint);
    }

    .link-preview-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .link-preview-image {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      display: block;
      background: #F0F0F0;
    }

    .link-preview-body {
      padding: 12px 14px;
    }

    .link-preview-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .link-preview-desc {
      font-size: 12px;
      color: var(--text-soft);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .link-preview-domain {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--hint);
      margin-top: 6px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .link-preview-domain img {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }

    .link-preview-error {
      padding: 12px 14px;
      font-size: 12px;
      color: var(--hint);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .category-switch {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: #F1F3F5;
      padding: 4px;
      border-radius: 14px;
    }

    .category-option {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-soft);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .category-option:active { transform: scale(0.97); }

    .category-option.active {
      background: white;
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .category-option.active[data-value="active"] { color: var(--accent-orange); }
    .category-option.active[data-value="mine"] { color: var(--accent-purple); }

    .category-desc {
      font-size: 12px;
      color: var(--hint);
      margin: -8px 0 16px;
      padding: 0 4px;
    }

    .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }

    .modal-buttons button {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .modal-buttons button:active { transform: scale(0.97); }

    .btn-cancel { 
      background: #F1F3F5; 
      color: var(--text); 
    }
    
    .btn-save { 
      background: linear-gradient(135deg, var(--brand), var(--brand-dark)); 
      color: white;
      box-shadow: 0 4px 12px rgba(0, 173, 230, 0.3);
    }
    
    .btn-delete { 
      background: linear-gradient(135deg, #FF5A87, #FF3D6E); 
      color: white;
      box-shadow: 0 4px 12px rgba(255, 90, 135, 0.3);
    }

    .btn-done-big {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent-mint), #2CA89E);
      color: white;
      box-shadow: 0 4px 14px rgba(78, 205, 196, 0.4);
      transition: transform 0.15s;
      margin-top: 10px;
    }

    .btn-done-big.reopen {
      background: #F1F3F5;
      color: var(--text);
      box-shadow: none;
    }

    .btn-done-big:active { transform: scale(0.98); }

    .detail-info {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .detail-info-item {
      background: white;
      padding: 8px 14px;
      border-radius: 14px;
      font-size: 13px;
      color: var(--text-soft);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }

    .detail-votes {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: linear-gradient(135deg, #FFF3E0, #FFE7CC);
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .detail-votes-info { font-size: 14px; }

    .detail-votes-count {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
      color: var(--accent-orange);
    }

    .detail-votes-label {
      font-size: 12px;
      color: var(--text-soft);
      margin-top: 4px;
      font-weight: 500;
    }

    .vote-big {
      padding: 12px 22px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: white;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 173, 230, 0.35);
    }

    .vote-big.voted { 
      background: linear-gradient(135deg, var(--accent-mint), #2CA89E);
      box-shadow: 0 4px 12px rgba(78, 205, 196, 0.4);
    }
    
    .vote-big:active { transform: scale(0.96); }

    .detail-section {
      margin-bottom: 16px;
      padding: 16px 18px;
      background: white;
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
    }

    .detail-section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--hint);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .detail-text {
      font-size: 15px;
      line-height: 1.55;
      word-wrap: break-word;
      white-space: pre-wrap;
      color: var(--text);
    }

    /* Крупное превью в детальном просмотре */
    .detail-link-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .detail-link-card:active { transform: scale(0.98); }

    .detail-link-image {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      display: block;
      background: #F0F0F0;
    }

    .detail-link-body {
      padding: 14px 16px;
    }

    .detail-link-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.35;
    }

    .detail-link-desc {
      font-size: 13px;
      color: var(--text-soft);
      line-height: 1.45;
      margin-bottom: 8px;
    }

    .detail-link-url {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--brand);
      font-weight: 600;
      word-break: break-all;
    }

    .detail-link-url img {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }

    /* Fallback ссылка */
    .detail-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--brand);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      word-break: break-all;
      padding: 10px 14px;
      background: var(--brand-light);
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .detail-link:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1><span class="emoji">🚀</span> Задачи</h1>
      <div id="user-info" class="user-info">
        <div id="avatar" class="avatar">?</div>
        <span id="user-name" class="user-name">...</span>
      </div>
    </header>
    
    <div class="month-card">
      <div class="month-icon">🏆</div>
      <div class="month-info">
        <div class="month-value" id="stat-month">0</div>
        <div class="month-label">закрыто в этом месяце</div>
        <div class="month-name" id="month-name">Загрузка...</div>
      </div>
    </div>
    
    <div class="stats">
      <div class="stat-card stat-active">
        <div class="stat-value" id="stat-active">0</div>
        <div class="stat-label">🔥 активных</div>
      </div>
      <div class="stat-card stat-done">
        <div class="stat-value" id="stat-done">0</div>
        <div class="stat-label">✅ готово</div>
      </div>
      <div class="stat-card stat-mine">
        <div class="stat-value" id="stat-mine">0</div>
        <div class="stat-label">👤 моих</div>
      </div>
    </div>
    
    <div class="filters">
      <button class="filter active" data-filter="active" onclick="setFilter('active')">🔥 Активные</button>
      <button class="filter" data-filter="mine" onclick="setFilter('mine')">👤 Мои</button>
      <button class="filter" data-filter="done" onclick="setFilter('done')">✅ Готово</button>
    </div>
    
    <div id="tasks" class="tasks">
      <div class="loading">⏳ Ищем ваши задачи...</div>
    </div>
  </div>
  
  <button class="add-btn" onclick="openAddModal()">
    <span class="add-btn-icon">+</span>
    Новая задача
  </button>
  
  <div id="edit-modal" class="modal">
    <div class="modal-content">
      <h2 id="edit-title">✨ Новая задача</h2>
      
      <label>📂 Категория</label>
      <div class="category-switch">
        <button type="button" class="category-option active" data-value="active" onclick="selectCategory('active')">
          🔥 Активные
        </button>
        <button type="button" class="category-option" data-value="mine" onclick="selectCategory('mine')">
          👤 Мои
        </button>
      </div>
      <div class="category-desc" id="category-desc">Общая задача для всей команды — все могут видеть и голосовать</div>
      
      <label>Название</label>
      <input id="task-input" type="text" placeholder="Что нужно сделать?" maxlength="150">
      
      <label>💡 Почему это важно</label>
      <textarea id="task-why" rows="3" placeholder="Обоснование, польза, контекст..." maxlength="1000"></textarea>
      
      <label>🔗 Ссылка (необязательно)</label>
      <input id="task-link" type="url" placeholder="https://..." maxlength="500">
      
      <!-- Превью ссылки -->
      <div id="link-preview" class="link-preview"></div>
      
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeEditModal()">Отмена</button>
        <button class="btn-save" onclick="saveTask()">Сохранить ✨</button>
      </div>
    </div>
  </div>

  <div id="detail-modal" class="modal">
    <div class="modal-content" id="detail-content"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ⚠️ ВСТАВЬТЕ СЮДА ВАШ КОНФИГ FIREBASE ⚠️
    const firebaseConfig = {
  apiKey: "AIzaSyAyQfQD8aRxLKhEtIcq4QzKjCLmJgQXlVc",
  authDomain: "miniappvolkov.firebaseapp.com",
  databaseURL: "https://miniappvolkov-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "miniappvolkov",
  storageBucket: "miniappvolkov.firebasestorage.app",
  messagingSenderId: "798881767507",
  appId: "1:798881767507:web:4d9061ef9beb42d607a6a6"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const tasksRef = ref(db, 'tasks');

    const tg = window.Telegram?.WebApp;
    const user = tg?.initDataUnsafe?.user;
    const userId = String(user?.id || 'test_' + Date.now());
    const userName = user?.first_name || (user?.username ? '@' + user.username : 'Гость');
    const userPhoto = user?.photo_url || null;

    if (tg) { 
      tg.ready(); 
      tg.expand();
      try {
        tg.setHeaderColor('#FFF5E6');
        tg.setBackgroundColor('#FFF5E6');
      } catch(e) {}
    }

    setupAvatar();

    function setupAvatar() {
      const avatarEl = document.getElementById('avatar');
      const nameEl = document.getElementById('user-name');
      nameEl.textContent = userName;
      
      if (userPhoto) {
        avatarEl.style.backgroundImage = `url(${userPhoto})`;
        avatarEl.textContent = '';
      } else {
        const initial = (userName[0] || '?').toUpperCase();
        const color = getColorFromId(userId);
        avatarEl.style.background = color;
        avatarEl.textContent = initial;
      }
    }

    function getColorFromId(id) {
      const colors = [
        '#FF6D00', '#FF5A87', '#7C5CFF', '#00ADE6',
        '#4ECDC4', '#FFDA47', '#FF9500', '#5AC8FA',
        '#AF52DE', '#34C759', '#FF3B30', '#5856D6'
      ];
      const hash = String(id).split('').reduce((a, c) => a + c.charCodeAt(0), 0);
      return colors[hash % colors.length];
    }

    function makeAvatarHtml(name, id, photo, size = 24) {
      const initial = (name?.[0] || '?').toUpperCase();
      const color = getColorFromId(id || name);
      const fontSize = Math.max(10, size * 0.42);
      if (photo) {
        return `<div style="width:${size}px;height:${size}px;border-radius:50%;background-image:url(${photo});background-size:cover;background-position:center;flex-shrink:0;"></div>`;
      }
      return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:${fontSize}px;flex-shrink:0;">${initial}</div>`;
    }

    let tasks = [];
    let currentFilter = 'active';
    let editingTaskId = null;
    let currentDetailId = null;
    let selectedCategory = 'active';
    let currentPreview = null; // {image, title, description, domain, logo}
    let previewDebounce = null;

    function haptic(type = 'light') {
      try {
        if (type === 'success') tg?.HapticFeedback?.notificationOccurred('success');
        else tg?.HapticFeedback?.impactOccurred(type);
      } catch(e) {}
    }

    // ============ ПРЕВЬЮ ССЫЛОК ============

    async function fetchLinkPreview(url) {
      try {
        const apiUrl = `https://api.microlink.io/?url=${encodeURIComponent(url)}&audio=false&video=false&iframe=false`;
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error('preview failed');
        const json = await res.json();
        if (json.status !== 'success') throw new Error('no data');
        
        const data = json.data || {};
        let domain = '';
        try { domain = new URL(url).hostname.replace('www.', ''); } catch(e) {}
        
        return {
          image: data.image?.url || null,
          title: data.title || domain || url,
          description: data.description || '',
          domain: domain,
          logo: data.logo?.url || null
        };
      } catch (e) {
        console.warn('Preview fetch failed:', e);
        return null;
      }
    }

    function renderLinkPreview(preview) {
      const container = document.getElementById('link-preview');
      if (!preview) {
        container.className = 'link-preview';
        container.innerHTML = '';
        return;
      }
      
      const img = preview.image 
        ? `<img class="link-preview-image" src="${escapeHtml(preview.image)}" onerror="this.style.display='none'">`
        : '';
      
      const logoImg = preview.logo 
        ? `<img src="${escapeHtml(preview.logo)}" onerror="this.style.display='none'">`
        : '';
      
      container.className = 'link-preview active';
      container.innerHTML = `
        ${img}
        <div class="link-preview-body">
          <div class="link-preview-title">${escapeHtml(preview.title)}</div>
          ${preview.description ? `<div class="link-preview-desc">${escapeHtml(preview.description)}</div>` : ''}
          <div class="link-preview-domain">
            ${logoImg}
            ${escapeHtml(preview.domain || 'ссылка')}
          </div>
        </div>
      `;
    }

    function showPreviewLoading() {
      const container = document.getElementById('link-preview');
      container.className = 'link-preview active loading';
      container.innerHTML = `
        <div class="link-preview-spinner"></div>
        <span>Загружаем превью...</span>
      `;
    }

    function showPreviewError() {
      const container = document.getElementById('link-preview');
      container.className = 'link-preview active';
      container.innerHTML = `
        <div class="link-preview-error">
          ⚠️ Не удалось загрузить превью
        </div>
      `;
    }

    async function handleLinkInput() {
      clearTimeout(previewDebounce);
      const linkInput = document.getElementById('task-link');
      let url = linkInput.value.trim();
      
      if (!url) {
        currentPreview = null;
        renderLinkPreview(null);
        return;
      }
      
      // Debounce 800ms
      previewDebounce = setTimeout(async () => {
        // Автоматически добавляем https://
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
        }
        
        if (!isValidUrl(url)) {
          currentPreview = null;
          renderLinkPreview(null);
          return;
        }
        
        showPreviewLoading();
        const preview = await fetchLinkPreview(url);
        
        if (preview && (preview.image || preview.title)) {
          currentPreview = preview;
          renderLinkPreview(preview);
        } else {
          currentPreview = null;
          showPreviewError();
        }
      }, 800);
    }

    // ============ ОСНОВНАЯ ЛОГИКА ============

    onValue(tasksRef, (snapshot) => {
      const data = snapshot.val() || {};
      tasks = Object.entries(data).map(([id, task]) => ({
        id,
        ...task,
        category: task.category || 'active',
        voters: task.voters || {},
        votes: task.voters ? Object.keys(task.voters).length : 0
      }));
      render();
      if (currentDetailId) {
        const t = tasks.find(x => x.id === currentDetailId);
        if (t) renderDetail(t);
      }
    });

    window.setFilter = function(f) {
      currentFilter = f;
      document.querySelectorAll('.filter').forEach(b => {
        b.classList.toggle('active', b.dataset.filter === f);
      });
      haptic('light');
      render();
    };

    window.selectCategory = function(cat) {
      selectedCategory = cat;
      document.querySelectorAll('.category-option').forEach(b => {
        b.classList.toggle('active', b.dataset.value === cat);
      });
      const desc = document.getElementById('category-desc');
      if (cat === 'active') {
        desc.textContent = 'Общая задача для всей команды — все могут видеть и голосовать';
      } else {
        desc.textContent = 'Личная задача — видна только вам';
      }
      haptic('light');
    };

    function getFiltered() {
      let list = [...tasks];
      
      if (currentFilter === 'active') {
        list = list.filter(t => !t.done && t.category === 'active');
      } else if (currentFilter === 'mine') {
        list = list.filter(t => !t.done && t.category === 'mine' && t.authorId === userId);
      } else if (currentFilter === 'done') {
        list = list.filter(t => t.done && (t.category === 'active' || t.authorId === userId));
      }
      
      list.sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        return b.votes - a.votes;
      });
      return list;
    }

    function render() {
      const container = document.getElementById('tasks');
      const list = getFiltered();
      
      const active = tasks.filter(t => !t.done && t.category === 'active').length;
      const done = tasks.filter(t => t.done && (t.category === 'active' || t.authorId === userId)).length;
      const mine = tasks.filter(t => !t.done && t.category === 'mine' && t.authorId === userId).length;
      
      const now = new Date();
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
      const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 1).getTime();
      const doneThisMonth = tasks.filter(t => {
        if (!t.done) return false;
        if (t.category === 'mine' && t.authorId !== userId) return false;
        const doneTime = t.doneAt || t.createdAt || 0;
        return doneTime >= monthStart && doneTime < monthEnd;
      }).length;
      
      const monthNames = [
        'январь', 'февраль', 'март', 'апрель', 'май', 'июнь',
        'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'
      ];
      const monthName = monthNames[now.getMonth()] + ' ' + now.getFullYear();
      
      document.getElementById('stat-active').textContent = active;
      document.getElementById('stat-done').textContent = done;
      document.getElementById('stat-mine').textContent = mine;
      document.getElementById('stat-month').textContent = doneThisMonth;
      document.getElementById('month-name').textContent = monthName;

      container.innerHTML = '';
      
      if (list.length === 0) {
        let emptyText = 'Здесь пока пусто';
        let emptySub = 'Предложите первую задачу!';
        if (currentFilter === 'mine') {
          emptyText = 'Нет личных задач';
          emptySub = 'Добавьте задачу в категории «Мои»';
        } else if (currentFilter === 'done') {
          emptyText = 'Ещё ничего не сделано';
          emptySub = 'Отметьте первую готовую задачу';
        }
        container.innerHTML = `
          <div class="empty">
            <span class="empty-emoji">🌱</span>
            ${emptyText}<br>
            <span style="font-size:13px;">${emptySub}</span>
          </div>
        `;
        return;
      }
      
      list.forEach(task => {
        const isVoted = task.voters && task.voters[userId];
        const isHot = task.votes >= 5 && !task.done && task.category === 'active';
        const isMineCategory = task.category === 'mine';
        const isMine = task.authorId === userId;
        
        const div = document.createElement('div');
        let classes = 'task';
        if (task.done) classes += ' done';
        else if (isMineCategory) classes += ' category-mine';
        else if (isHot) classes += ' hot';
        div.className = classes;
        
        const hasWhy = task.why && task.why.trim();
        const hasLink = task.link && task.link.trim();
        const badges = [];
        if (isMineCategory && !task.done) badges.push('<span class="badge-pill badge-category-mine">👤 личная</span>');
        if (hasWhy) badges.push('<span class="badge-pill">📝 описание</span>');
        if (hasLink) badges.push('<span class="badge-pill">🔗 ссылка</span>');
        
        const voteBlock = task.category === 'active' ? `
          <button class="vote ${isVoted ? 'voted' : ''}" data-id="${task.id}" data-action="vote">
            <span class="vote-emoji">${isVoted ? '❤️' : '👍'}</span>
            <span class="vote-count">${task.votes}</span>
          </button>
        ` : '';
        
        // Миниатюра превью
        const thumbHtml = task.preview?.image 
          ? `<div class="task-thumb" style="background-image:url('${escapeHtml(task.preview.image)}')" data-id="${task.id}" data-action="open"></div>`
          : '';
        
        div.innerHTML = `
          <button class="check ${task.done ? 'done' : ''}" data-id="${task.id}" data-action="check">
            ${task.done ? '✓' : ''}
          </button>
          ${thumbHtml}
          <div class="task-body" data-id="${task.id}" data-action="open">
            <div class="task-title ${task.done ? 'strike' : ''}">
              ${isHot ? '<span class="fire">🔥</span>' : ''}${escapeHtml(task.title)}
            </div>
            <div class="task-badges">
              ${badges.join('')}
              <span class="badge-author">от ${escapeHtml(task.author)}${isMine ? ' (вы)' : ''}</span>
            </div>
          </div>
          ${voteBlock}
        `;
        container.appendChild(div);
      });

      container.querySelectorAll('[data-action="vote"]').forEach(el => {
        el.onclick = (e) => { e.stopPropagation(); vote(el.dataset.id); };
      });
      container.querySelectorAll('[data-action="check"]').forEach(el => {
        el.onclick = (e) => { e.stopPropagation(); toggleDone(el.dataset.id); };
      });
      container.querySelectorAll('[data-action="open"]').forEach(el => {
        el.onclick = () => openDetail(el.dataset.id);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function isValidUrl(str) {
      try {
        const url = new URL(str);
        return url.protocol === 'http:' || url.protocol === 'https:';
      } catch { return false; }
    }

    async function vote(id) {
      const task = tasks.find(t => t.id === id);
      if (!task || task.category !== 'active') return;
      const voters = { ...(task.voters || {}) };
      if (voters[userId]) delete voters[userId];
      else voters[userId] = true;
      haptic('light');
      await update(ref(db, `tasks/${id}`), { voters });
    }

    async function toggleDone(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      haptic('success');
      await update(ref(db, `tasks/${id}`), { 
        done: !task.done,
        doneBy: !task.done ? userName : null,
        doneById: !task.done ? userId : null,
        doneAt: !task.done ? Date.now() : null
      });
    }

    window.openDetail = function(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      currentDetailId = id;
      renderDetail(task);
      document.getElementById('detail-modal').classList.add('active');
      haptic('light');
    };

    function renderDetail(task) {
      const isVoted = task.voters && task.voters[userId];
      const isMine = task.authorId === userId;
      const isMineCategory = task.category === 'mine';
      const dateCreated = task.createdAt ? new Date(task.createdAt).toLocaleDateString('ru-RU') : '';
      const linkValid = task.link && isValidUrl(task.link);
      const preview = task.preview;
      
      const votesBlock = task.category === 'active' ? `
        <div class="detail-votes">
          <div class="detail-votes-info">
            <div class="detail-votes-count">${task.votes}</div>
            <div class="detail-votes-label">
              ${task.votes === 0 ? 'ещё нет голосов' : task.votes === 1 ? 'человек проголосовал' : task.votes < 5 ? 'человека проголосовали' : 'человек поддержали'}
            </div>
          </div>
          <button class="vote-big ${isVoted ? 'voted' : ''}" onclick="voteDetail('${task.id}')">
            ${isVoted ? '❤️ Отдан' : '👍 Голосую'}
          </button>
        </div>
      ` : `
        <div class="detail-votes" style="background:linear-gradient(135deg, rgba(124,92,255,0.12), rgba(124,92,255,0.06));">
          <div class="detail-votes-info">
            <div class="detail-votes-count" style="color:var(--accent-purple);">👤</div>
            <div class="detail-votes-label">Личная задача</div>
          </div>
        </div>
      `;
      
      // Блок ссылки: превью-карточка или обычная ссылка
      let linkBlock = '';
      if (linkValid) {
        if (preview && (preview.image || preview.title)) {
          const img = preview.image 
            ? `<img class="detail-link-image" src="${escapeHtml(preview.image)}" onerror="this.style.display='none'">`
            : '';
          const logoImg = preview.logo 
            ? `<img src="${escapeHtml(preview.logo)}" onerror="this.style.display='none'">`
            : '';
          linkBlock = `
            <div class="detail-link-card" onclick="openLink('${escapeHtml(task.link)}')">
              ${img}
              <div class="detail-link-body">
                <div class="detail-link-title">${escapeHtml(preview.title || task.link)}</div>
                ${preview.description ? `<div class="detail-link-desc">${escapeHtml(preview.description)}</div>` : ''}
                <div class="detail-link-url">
                  ${logoImg}
                  🔗 ${escapeHtml(preview.domain || task.link)}
                </div>
              </div>
            </div>
          `;
        } else {
          linkBlock = `
            <div class="detail-section">
              <div class="detail-section-title">🔗 Ссылка</div>
              <div class="detail-link" onclick="openLink('${escapeHtml(task.link)}')">
                🌐 <span>${escapeHtml(task.link)}</span>
              </div>
            </div>
          `;
        }
      }
      
      document.getElementById('detail-content').innerHTML = `
        <h2>${task.done ? '✅ ' : (isMineCategory ? '👤 ' : '🚀 ')}${escapeHtml(task.title)}</h2>
        
        <div class="detail-info">
          <div class="detail-info-item">
            ${makeAvatarHtml(task.author, task.authorId, task.authorPhoto, 20)}
            <span>${escapeHtml(task.author)}${isMine ? ' (вы)' : ''}</span>
          </div>
          ${dateCreated ? `<div class="detail-info-item">📅 ${dateCreated}</div>` : ''}
          ${task.done && task.doneBy ? `<div class="detail-info-item">✓ ${escapeHtml(task.doneBy)}</div>` : ''}
        </div>
        
        ${votesBlock}
        
        ${task.why ? `
          <div class="detail-section">
            <div class="detail-section-title">💡 Почему это важно</div>
            <div class="detail-text">${escapeHtml(task.why)}</div>
          </div>
        ` : ''}
        
        ${linkBlock}
        
        <button class="btn-done-big ${task.done ? 'reopen' : ''}" onclick="toggleDoneFromDetail('${task.id}')">
          ${task.done ? '↩ Вернуть в работу' : '✓ Готово'}
        </button>
        
        ${isMine ? `
          <div class="modal-buttons" style="margin-top:10px;">
            <button class="btn-cancel" onclick="editTask('${task.id}')">✏ Изменить</button>
            <button class="btn-delete" onclick="deleteTask('${task.id}')">🗑 Удалить</button>
          </div>
        ` : ''}
      `;
      
      setupSwipeToClose();
    }

    function setupSwipeToClose() {
      const modalContent = document.querySelector('#detail-modal .modal-content');
      if (!modalContent) return;
      
      let startY = 0;
      let currentY = 0;
      let isDragging = false;
      
      const onTouchStart = (e) => {
        if (modalContent.scrollTop > 0) return;
        startY = e.touches[0].clientY;
        currentY = startY;
        isDragging = true;
        modalContent.classList.add('dragging');
      };
      
      const onTouchMove = (e) => {
        if (!isDragging) return;
        currentY = e.touches[0].clientY;
        const diff = currentY - startY;
        if (diff < 0) {
          modalContent.style.transform = 'translateY(0)';
          return;
        }
        if (modalContent.scrollTop > 0) {
          isDragging = false;
          modalContent.style.transform = '';
          modalContent.classList.remove('dragging');
          return;
        }
        modalContent.style.transform = `translateY(${diff}px)`;
      };
      
      const onTouchEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        modalContent.classList.remove('dragging');
        const diff = currentY - startY;
        if (diff > 100) {
          modalContent.style.transform = '';
          closeDetailAnimated();
        } else {
          modalContent.style.transform = '';
        }
      };
      
      modalContent.addEventListener('touchstart', onTouchStart, { passive: true });
      modalContent.addEventListener('touchmove', onTouchMove, { passive: true });
      modalContent.addEventListener('touchend', onTouchEnd, { passive: true });
    }

    function closeDetailAnimated() {
      const modal = document.getElementById('detail-modal');
      const content = modal.querySelector('.modal-content');
      content.classList.add('closing');
      setTimeout(() => {
        modal.classList.remove('active');
        content.classList.remove('closing');
        content.style.transform = '';
        currentDetailId = null;
      }, 280);
    }

    window.closeDetail = function() { closeDetailAnimated(); };
    window.voteDetail = function(id) { vote(id); };
    window.toggleDoneFromDetail = function(id) { toggleDone(id); };
    window.openLink = function(url) {
      if (tg?.openLink) tg.openLink(url);
      else window.open(url, '_blank');
    };

    window.deleteTask = async function(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      const confirmMsg = 'Удалить задачу «' + task.title + '»?';
      if (tg?.showConfirm) {
        tg.showConfirm(confirmMsg, async (ok) => {
          if (ok) {
            await remove(ref(db, `tasks/${id}`));
            closeDetailAnimated();
            haptic('success');
          }
        });
      } else {
        if (confirm(confirmMsg)) {
          await remove(ref(db, `tasks/${id}`));
          closeDetailAnimated();
        }
      }
    };

    window.editTask = function(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      editingTaskId = id;
      selectedCategory = task.category || 'active';
      currentPreview = task.preview || null;
      document.getElementById('edit-title').textContent = '✏ Изменить';
      document.getElementById('task-input').value = task.title || '';
      document.getElementById('task-why').value = task.why || '';
      document.getElementById('task-link').value = task.link || '';
      selectCategory(selectedCategory);
      renderLinkPreview(currentPreview);
      closeDetailAnimated();
      setTimeout(() => {
        document.getElementById('edit-modal').classList.add('active');
        document.getElementById('task-input').focus();
      }, 250);
    };

    window.openAddModal = function() {
      editingTaskId = null;
      selectedCategory = currentFilter === 'mine' ? 'mine' : 'active';
      currentPreview = null;
      document.getElementById('edit-title').textContent = '✨ Новая задача';
      document.getElementById('task-input').value = '';
      document.getElementById('task-why').value = '';
      document.getElementById('task-link').value = '';
      selectCategory(selectedCategory);
      renderLinkPreview(null);
      document.getElementById('edit-modal').classList.add('active');
      setTimeout(() => document.getElementById('task-input').focus(), 100);
    };

    window.closeEditModal = function() {
      document.getElementById('edit-modal').classList.remove('active');
      editingTaskId = null;
      currentPreview = null;
      clearTimeout(previewDebounce);
    };

    window.saveTask = async function() {
      const title = document.getElementById('task-input').value.trim();
      const why = document.getElementById('task-why').value.trim();
      let link = document.getElementById('task-link').value.trim();
      
      if (!title) return;
      
      if (link) {
        if (!link.startsWith('http://') && !link.startsWith('https://')) {
          link = 'https://' + link;
        }
        if (!isValidUrl(link)) {
          if (tg?.showAlert) tg.showAlert('Некорректная ссылка');
          else alert('Некорректная ссылка');
          return;
        }
      }
      
      haptic('success');
      
      // Данные превью — только валидные поля (Firebase не любит undefined)
      const previewData = currentPreview && link ? {
        image: currentPreview.image || null,
        title: currentPreview.title || null,
        description: currentPreview.description || null,
        domain: currentPreview.domain || null,
        logo: currentPreview.logo || null
      } : null;
      
      if (editingTaskId) {
        await update(ref(db, `tasks/${editingTaskId}`), {
          title, why, link,
          category: selectedCategory,
          preview: previewData,
          updatedAt: Date.now()
        });
      } else {
        const newTask = {
          title, why, link,
          category: selectedCategory,
          preview: previewData,
          voters: selectedCategory === 'active' ? { [userId]: true } : {},
          done: false,
          author: userName,
          authorId: userId,
          authorPhoto: userPhoto || null,
          createdAt: Date.now()
        };
        await push(tasksRef, newTask);
      }
      
      if (!editingTaskId) {
        setFilter(selectedCategory);
      }
      
      closeEditModal();
    };

    document.getElementById('edit-modal').addEventListener('click', (e) => {
      if (e.target.id === 'edit-modal') closeEditModal();
    });
    document.getElementById('detail-modal').addEventListener('click', (e) => {
      if (e.target.id === 'detail-modal') closeDetailAnimated();
    });

    document.getElementById('task-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        saveTask();
      }
    });

    // Слушаем изменения поля ссылки — грузим превью
    document.getElementById('task-link').addEventListener('input', handleLinkInput);
    document.getElementById('task-link').addEventListener('paste', () => {
      setTimeout(handleLinkInput, 50);
    });

    if (tg?.BackButton) {
      tg.BackButton.onClick(() => {
        if (document.getElementById('edit-modal').classList.contains('active')) {
          closeEditModal();
        } else if (document.getElementById('detail-modal').classList.contains('active')) {
          closeDetailAnimated();
        }
      });
      
      const observer = new MutationObserver(() => {
        const anyModalOpen = 
          document.getElementById('edit-modal').classList.contains('active') ||
          document.getElementById('detail-modal').classList.contains('active');
        if (anyModalOpen) tg.BackButton.show();
        else tg.BackButton.hide();
      });
      observer.observe(document.getElementById('edit-modal'), { attributes: true });
      observer.observe(document.getElementById('detail-modal'), { attributes: true });
    }
  </script>

</body>
</html>
