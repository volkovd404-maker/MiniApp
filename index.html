<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Задачи команды</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #000000);
      --card: var(--tg-theme-secondary-bg-color, #f4f4f5);
      --hint: var(--tg-theme-hint-color, #999999);
      --button: var(--tg-theme-button-color, #3b82f6);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px 16px 100px;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    .container { max-width: 600px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    h1 { font-size: 24px; font-weight: 700; }

    .user-badge {
      font-size: 12px;
      color: var(--hint);
      padding: 4px 10px;
      background: var(--card);
      border-radius: 12px;
    }

    .stats { font-size: 13px; color: var(--hint); margin-bottom: 20px; }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }

    .filter {
      padding: 8px 14px;
      border-radius: 20px;
      background: var(--card);
      color: var(--text);
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter.active { background: var(--button); color: var(--button-text); }

    .tasks { display: flex; flex-direction: column; gap: 10px; }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--hint);
      font-size: 15px;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--hint);
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--card);
      border-radius: 16px;
      border-left: 4px solid var(--button);
      transition: all 0.2s;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task.done { opacity: 0.55; border-left-color: #22c55e; }
    .task.hot:not(.done) { border-left-color: #f97316; }
    .task.mine { border-left-color: #a855f7; }

    .check {
      width: 26px; height: 26px; min-width: 26px;
      border-radius: 50%;
      border: 2px solid var(--hint);
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }

    .check.done { background: #22c55e; border-color: #22c55e; }

    .task-body { flex: 1; min-width: 0; }
    .task-title { font-size: 15px; font-weight: 500; word-wrap: break-word; }
    .task-title.strike { text-decoration: line-through; }
    .task-meta { font-size: 11px; color: var(--hint); margin-top: 4px; }

    .fire { display: inline-block; margin-right: 4px; }

    .vote {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-width: 52px;
      padding: 6px 10px;
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--hint);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }

    .vote:active { transform: scale(0.94); }
    .vote.voted { background: var(--button); color: var(--button-text); border-color: var(--button); }
    .vote-count { font-weight: 700; font-size: 14px; margin-top: 2px; }

    .add-btn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      background: var(--button);
      color: var(--button-text);
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      z-index: 50;
    }

    .add-btn:active { transform: translateX(-50%) scale(0.96); }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }

    .modal.active { display: flex; animation: fadeIn 0.2s ease; }

    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }

    .modal-content {
      background: var(--bg);
      border-radius: 20px 20px 0 0;
      padding: 24px 20px;
      max-width: 500px;
      width: 100%;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); } to { transform: translateY(0); }
    }

    .modal h2 { margin-bottom: 16px; font-size: 20px; }

    .modal input, .modal textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--hint);
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      margin-bottom: 12px;
      resize: none;
    }

    .modal input:focus, .modal textarea:focus {
      outline: none; border-color: var(--button);
    }

    .modal-buttons { display: flex; gap: 10px; }

    .modal-buttons button {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel { background: var(--card); color: var(--text); }
    .btn-save { background: var(--button); color: var(--button-text); }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .delete-btn {
      background: transparent;
      border: none;
      color: var(--hint);
      cursor: pointer;
      font-size: 18px;
      padding: 4px 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎯 Задачи команды</h1>
      <div id="user-badge" class="user-badge">Загрузка...</div>
    </header>
    <div id="stats" class="stats"></div>
    
    <div class="filters">
      <button class="filter active" data-filter="all" onclick="setFilter('all')">Все</button>
      <button class="filter" data-filter="active" onclick="setFilter('active')">🔥 Активные</button>
      <button class="filter" data-filter="mine" onclick="setFilter('mine')">👤 Мои</button>
      <button class="filter" data-filter="done" onclick="setFilter('done')">✅ Готово</button>
      <button class="filter" data-filter="top" onclick="setFilter('top')">⭐ Топ</button>
    </div>
    
    <div id="tasks" class="tasks">
      <div class="loading">⏳ Загрузка задач...</div>
    </div>
  </div>
  
  <button class="add-btn" onclick="openModal()">➕ Предложить задачу</button>
  
  <div id="modal" class="modal">
    <div class="modal-content">
      <h2>💡 Новая задача</h2>
      <input id="task-input" type="text" placeholder="Название задачи..." maxlength="100">
      <textarea id="task-desc" rows="2" placeholder="Описание (необязательно)..." maxlength="300"></textarea>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal()">Отмена</button>
        <button class="btn-save" onclick="addTask()">Добавить</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ⚠️ ВСТАВЬТЕ СЮДА ВАШ КОНФИГ ИЗ FIREBASE ⚠️
const firebaseConfig = {
  apiKey: "AIzaSyAyQfQD8aRxLKhEtIcq4QzKjCLmJgQXlVc",
  authDomain: "miniappvolkov.firebaseapp.com",
  databaseURL: "https://miniappvolkov-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "miniappvolkov",
  storageBucket: "miniappvolkov.firebasestorage.app",
  messagingSenderId: "798881767507",
  appId: "1:798881767507:web:4d9061ef9beb42d607a6a6"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const tasksRef = ref(db, 'tasks');

    // Telegram
    const tg = window.Telegram?.WebApp;
    const user = tg?.initDataUnsafe?.user;
    const userId = String(user?.id || 'test_' + Date.now());
    const userName = user?.first_name || (user?.username ? '@' + user.username : 'Гость');
    const userFullName = [user?.first_name, user?.last_name].filter(Boolean).join(' ') || userName;

    if (tg) { tg.ready(); tg.expand(); }

    // Показываем имя пользователя
    document.getElementById('user-badge').textContent = '👤 ' + userName;

    // Глобальные переменные
    let tasks = [];
    let currentFilter = 'all';

    function haptic(type = 'light') {
      try {
        if (type === 'success') tg?.HapticFeedback?.notificationOccurred('success');
        else tg?.HapticFeedback?.impactOccurred(type);
      } catch(e) {}
    }

    // Слушаем изменения в Firebase (в реальном времени!)
    onValue(tasksRef, (snapshot) => {
      const data = snapshot.val() || {};
      tasks = Object.entries(data).map(([id, task]) => ({
        id,
        ...task,
        voters: task.voters || {},
        votes: task.voters ? Object.keys(task.voters).length : 0
      }));
      render();
    });

    window.setFilter = function(f) {
      currentFilter = f;
      document.querySelectorAll('.filter').forEach(b => {
        b.classList.toggle('active', b.dataset.filter === f);
      });
      haptic('light');
      render();
    };

    function getFiltered() {
      let list = [...tasks];
      if (currentFilter === 'active') list = list.filter(t => !t.done);
      else if (currentFilter === 'done') list = list.filter(t => t.done);
      else if (currentFilter === 'top') list = list.filter(t => !t.done && t.votes >= 5);
      else if (currentFilter === 'mine') list = list.filter(t => t.authorId === userId);
      list.sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        return b.votes - a.votes;
      });
      return list;
    }

    function render() {
      const container = document.getElementById('tasks');
      const list = getFiltered();
      const stats = document.getElementById('stats');
      const active = tasks.filter(t => !t.done).length;
      const done = tasks.filter(t => t.done).length;
      const mine = tasks.filter(t => t.authorId === userId).length;
      stats.textContent = `Активных: ${active} · Выполнено: ${done} · Моих: ${mine}`;

      container.innerHTML = '';
      
      if (list.length === 0) {
        container.innerHTML = '<div class="empty">Пока пусто 🌱<br>Предложите первую задачу!</div>';
        return;
      }
      
      list.forEach(task => {
        const isVoted = task.voters && task.voters[userId];
        const isHot = task.votes >= 5 && !task.done;
        const isMine = task.authorId === userId;
        const div = document.createElement('div');
        div.className = 'task' + (task.done ? ' done' : '') + (isHot ? ' hot' : '') + (isMine && !task.done && !isHot ? ' mine' : '');
        div.innerHTML = `
          <button class="check ${task.done ? 'done' : ''}" data-id="${task.id}">
            ${task.done ? '✓' : ''}
          </button>
          <div class="task-body">
            <div class="task-title ${task.done ? 'strike' : ''}">
              ${isHot ? '<span class="fire">🔥</span>' : ''}${escapeHtml(task.title)}
            </div>
            ${task.desc ? `<div class="task-meta">${escapeHtml(task.desc)}</div>` : ''}
            <div class="task-meta">от ${escapeHtml(task.author)}${isMine ? ' (вы)' : ''}</div>
          </div>
          <button class="vote ${isVoted ? 'voted' : ''}" data-id="${task.id}">
            👍
            <span class="vote-count">${task.votes}</span>
          </button>
          ${isMine ? `<button class="delete-btn" data-id="${task.id}" data-action="delete">🗑</button>` : ''}
        `;
        container.appendChild(div);
      });

      // Обработчики
      container.querySelectorAll('.vote').forEach(el => {
        el.onclick = () => vote(el.dataset.id);
      });
      container.querySelectorAll('.check').forEach(el => {
        el.onclick = () => toggleDone(el.dataset.id);
      });
      container.querySelectorAll('[data-action="delete"]').forEach(el => {
        el.onclick = () => deleteTask(el.dataset.id);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    async function vote(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      const voters = { ...(task.voters || {}) };
      if (voters[userId]) delete voters[userId];
      else voters[userId] = true;
      haptic('light');
      await update(ref(db, `tasks/${id}`), { voters });
    }

    async function toggleDone(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      haptic('success');
      await update(ref(db, `tasks/${id}`), { 
        done: !task.done,
        doneBy: !task.done ? userName : null
      });
    }

    async function deleteTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      if (!confirm('Удалить задачу «' + task.title + '»?')) return;
      haptic('light');
      await remove(ref(db, `tasks/${id}`));
    }

    window.openModal = function() {
      document.getElementById('modal').classList.add('active');
      setTimeout(() => document.getElementById('task-input').focus(), 100);
    };

    window.closeModal = function() {
      document.getElementById('modal').classList.remove('active');
      document.getElementById('task-input').value = '';
      document.getElementById('task-desc').value = '';
    };

    window.addTask = async function() {
      const input = document.getElementById('task-input');
      const desc = document.getElementById('task-desc');
      const title = input.value.trim();
      if (!title) return;
      
      const newTask = {
        title: title,
        desc: desc.value.trim(),
        voters: { [userId]: true },
        done: false,
        author: userName,
        authorId: userId,
        createdAt: Date.now()
      };
      
      haptic('success');
      await push(tasksRef, newTask);
      closeModal();
    };

    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });

    document.getElementById('task-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTask();
    });
  </script>

</body>
</html>
